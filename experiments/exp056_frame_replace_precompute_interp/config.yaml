# Re-precompute the frame_replace edited-target latents with the NEW motion-preserving donor edit.
# Run with: ./submit_job.py athena experiments/exp056_frame_replace_precompute_interp/config.yaml
job_type: precompute
method: frame_replace

# Same curated prompt set, seeds, and generation params as exp042 -> identical clips; the ONLY
# difference is edit_latent, which now linearly interpolates across each fire block instead of
# hard-copying one frozen donor frame (exp055 fix A). This makes exp056-vs-exp042 a clean A/B on
# donor construction alone. The training run (exp057) points its metadata_file/latents_dir here.
csv_path: prompts/cogvideox_partial_fire_curated.csv

model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0
frame_fire_threshold: 0.5
min_nofire_frames: 2
# Decode + write the edited MP4s so the interpolated targets can be eyeballed / motion-scored
# directly (they should no longer freeze across fire blocks).
save_videos: true

slurm_time: "16:00:00"
