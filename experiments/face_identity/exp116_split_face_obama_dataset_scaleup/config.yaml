# Scale-up of the Barack Obama split-prompt frame_replace dataset. exp115 (split_step_frac 0.8)
# kept only 9/30 triples on human review, and its metadata shows why: 14 of the 21 rejects have
# original_max_confidence ~0.0 -- the base model rendered no recognizable Obama at all for that
# (prompt, seed), in a wide/side-on/occluded framing. That's a prompt-framing problem, not a
# split_step_frac problem, so this reuses exp115's recipe field-for-field and only swaps in new
# CSVs: one re-seed of the existing 30 prompts (isolates seed variance) plus two 30-row sets of
# new, framing-controlled (medium/close, frontal) prompts. See notes.md for the framing analysis
# and tools/screen_split_face_dataset.py for the automated pre-screen used before human review.
# Run: ./submit_job.py helios experiments/face_identity/exp116_split_face_obama_dataset_scaleup/config.yaml
job_type: precompute
method: frame_replace_split

# List -> submit_job.py grids one job per CSV (3 parallel runs, each 30 rows like exp115).
csv_path:
  - prompts/face_identities/split/barack_obama_reseed.csv     # existing 30 prompts, new seeds 7801-7830
  - prompts/face_identities/split/barack_obama_closeup1.csv    # 30 new framing-controlled prompts, 7831-7860
  - prompts/face_identities/split/barack_obama_closeup2.csv    # 30 new framing-controlled prompts, 7861-7890
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Split sampler + de-biasing knobs, identical to exp115 -- split_step_frac stays at 0.8, which
# fixed exp092's chimera-face problem. No frac sweep here: the yield loss is a framing problem
# (see notes.md), not a sampler problem.
split_latent_frame: 7
concept_region: random
split_jitter: 2
split_step_frac: 0.8

# Detection -> logging only; the concept mask is derived from (split_latent_frame, concept_region),
# not from the detector (docs/split_prompt.md). concept/concept_target select the ArcFace detector
# via zml/benchmarks/registry.py.
concept: face
concept_target: "Barack Obama"
frame_concept_threshold: 0.3
min_donor_frames: 2
save_videos: true

# Also build the whole-clip target variant, consumed by exp095's target_variant grid.
emit_whole_clip_target: true

# Same shape as exp115 (30 rows, emit_whole_clip_target: true, 3h36m); each grid run is independently
# 30 rows, so the same budget applies to every run.
slurm_time: "0-10:00:00"
