# frame_replace erasure of BARACK OBAMA, copying exp080's human-reviewed best nudity regime
# (grid run_002, learning_rate 1e-4, eval_step_120) field-for-field so a difference in outcome is
# attributable to the concept, not the recipe. `target_variant` is gridded [split, wholeclip] — the
# A/B this run exists to answer: for a concept this seam-visible, does the temporally-spliced target
# or the whole-clip target erase better / preserve better? See docs/face_identity.md R4/R5.
#
# exp092 (30 triples, split_step_frac 0.5) was superseded by exp115 (0.8, fixes the chimera-face
# whole-clip target) -- but exp115 only yielded 9/30 on human review. exp116 scaled that up (reseed
# + framing-controlled prompts, 43/90 kept) and merges its keeps with exp115's 9 into one
# combined_dataset/ (52 triples total) via:
#   ./merge_dataset.sh --cluster helios \
#     --output experiments/face_identity/exp116_split_face_obama_dataset_scaleup/combined_dataset \
#     --source experiments/face_identity/exp115_split_face_obama_dataset_frac08/metadata_human_filtered.json \
#              experiments/face_identity/exp115_split_face_obama_dataset_frac08/outputs_20260812_141127/latents \
#     --source experiments/face_identity/exp116_split_face_obama_dataset_scaleup/metadata_human_filtered_run001.json \
#              experiments/face_identity/exp116_split_face_obama_dataset_scaleup/grid_20260813_173003/run_001/outputs/latents \
#     --source experiments/face_identity/exp116_split_face_obama_dataset_scaleup/metadata_human_filtered_run002.json \
#              experiments/face_identity/exp116_split_face_obama_dataset_scaleup/grid_20260813_173003/run_002/outputs/latents \
#     --source experiments/face_identity/exp116_split_face_obama_dataset_scaleup/metadata_human_filtered_run003.json \
#              experiments/face_identity/exp116_split_face_obama_dataset_scaleup/grid_20260813_173003/run_003/outputs/latents
# Run that once (project owner, on the cluster) before submitting this config.
# Run: ./submit_job.py helios experiments/face_identity/exp095_frame_replace_obama/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: face               # live eval scores with ArcFace ID-similarity
concept_target: "Barack Obama"

metadata_file: experiments/face_identity/exp116_split_face_obama_dataset_scaleup/combined_dataset/metadata.json
latents_dir: experiments/face_identity/exp116_split_face_obama_dataset_scaleup/combined_dataset/latents
target_variant: [split, wholeclip]

# Retention: the other four identities + the 10 generic-face anchors. retention_exclude drops
# Obama's own anchors, which would otherwise pull directly against the erase branch.
retention_metadata_file: experiments/face_identity/exp094_face_preservation/outputs_20260811_185230/metadata.json
retention_latents_dir: experiments/face_identity/exp094_face_preservation/outputs_20260811_185230/latents
retention_exclude: "Barack Obama"
retention_weight: 1.0

# exp080 run_002's regime verbatim — the human-reviewed best nudity checkpoint's config.
nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2

# Live-eval sets. The concept set is the 30 published eval prompts for Obama — none of which has an
# identity-free half — so erasure here is also the positional-shortcut test: a LoRA that only
# learned "copy the donor half" fails on them.
control_concept_prompts: prompts/face_identities/barack_obama.csv
control_related_prompts: prompts/face_identities/others_barack_obama.csv   # required slot, unscored in training
control_unrelated_prompts: prompts/face_identities/others_barack_obama.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 20

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

# exp080's own regime at this step/eval budget ran comfortably inside 16h; +4h margin for the
# target_variant grid's second arm reusing the same dataset (no extra precompute, just training).
slurm_time: "0-16:00:00"
