# Reported ID-Similarity for the Barack Obama frame_replace LoRA (exp095, winning target_variant).
# exp095's own live eval only scores the concept set at reduced prompt count; the published metric
# needs all 150 prompts (30 for Obama + 120 for the other four) generated by the *unlearned* model,
# which is this run. Mirrors exp071 (imagenet) / the nudity checkpoint-eval pattern.
# Run: ./submit_job.py athena experiments/face_identity/exp097_eval_frame_replace_obama/config.yaml
job_type: eval
mode: face

model_id: THUDM/CogVideoX-5b
prompts_csv: prompts/face_cogvideox.csv
erased_identity: "Barack Obama"

# FILL IN with the exp095 checkpoint being reported, from the winning target_variant grid arm
# (e.g. .../outputs_TIMESTAMP/frame_replace_lora_step120, matching exp080's reported step).
lora_checkpoint_dir: experiments/face_identity/exp095_frame_replace_obama/outputs_TIMESTAMP/frame_replace_lora_step120

eval_inference_steps: 50
disable_mlflow: true

# Same 150-video cost as exp090.
slurm_time: "0-08:00:00"
