# Preservation (retention-anchor) latents for the ImageNet object-erasure protocol.
# One dataset covers all ten classes; each erase run drops the class it is erasing via
# `retention_exclude`, so anchors only ever hold the nine classes PSR is measured on.
# The prompts are disjoint from prompts/imagenet_objects.csv on purpose — we preserve the classes,
# not the test items. Run: ./submit_job.py athena experiments/exp068_imagenet_preservation/config.yaml
job_type: precompute
method: preservation

csv_path: prompts/imagenet_preservation.csv   # 10 classes x 3 prompts, seeds 4301-4330

model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0
save_videos: false

# 30 clips, generation only (no detection or editing). exp041 allowed 8 h for 25 clips.
slurm_time: "0-08:00:00"
