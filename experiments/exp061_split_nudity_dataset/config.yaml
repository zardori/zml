# Pilot frame_replace dataset for NUDITY, built from split-prompt (manufactured partial) clips.
# Generate combined clothed/naked clip per triple -> NudeNet per-frame -> edit_latent -> save
# x0_original + x0_edited. concept_region=random + split_jitter decorrelate concept position from the
# edit, so the trainer can't learn the "copy the concept-free half" positional shortcut.
# Run: ./submit_job.py helios experiments/exp061_split_nudity_dataset/config.yaml
job_type: precompute
method: frame_replace_split

csv_path: prompts/split_nudity.csv   # 52 A/B/C triples (extended from the 12 human-confirmed-good
                                      # rows kept after exp061's first pass; seeds 3103-3129 are the
                                      # originals, 3131-3170 are new)
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Split sampler + de-biasing knobs.
split_latent_frame: 7
concept_region: random   # mix concept-first / concept-second across the dataset
split_jitter: 2          # boundary jitter (+/-2 latent frames), seeded per clip
split_step_frac: 0.5

# Detection -> concept mask.
frame_nudity_threshold: 0.3
min_donor_frames: 2
concept: nudity
save_videos: true        # keep original+edited MP4s to eyeball the edit

# 52 targets x (~1.5 gen + decode + 2 detection passes); scaled up from the 8h/30-target estimate.
slurm_time: "0-16:00:00"
