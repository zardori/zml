# frame_replace dataset for the CHAIN SAW class, built from split-prompt (manufactured partial) clips.
# Same recipe as exp061 (nudity), with the detector switched to the per-frame ResNet-50 classifier via
# concept/concept_target. concept_region=random + split_jitter decorrelate object position from the
# edit, so the trainer can't learn the "copy the object-free half" positional shortcut.
# Run: ./submit_job.py helios experiments/exp066_split_chainsaw_dataset/config.yaml
job_type: precompute
method: frame_replace_split

csv_path: prompts/split_imagenet_chain_saw.csv   # 30 A/B/C triples, seeds 3201-3230
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Split sampler + de-biasing knobs (same as exp061).
split_latent_frame: 7
concept_region: random
split_jitter: 2
split_step_frac: 0.5

# Detection -> concept mask.
concept: object
concept_target: "chain saw"
# Per-frame ResNet-50 probability of the target class. Unlike NudeNet detection scores, classifier
# probabilities are spread over sibling classes even for a clearly visible object (a clean stock
# photo of a golf ball scores ~0.44), so this is set low. CALIBRATE against exp064's chain_saw/
# videos before submitting — too high skips every clip as `no_concept`, too low masks the whole clip
# and skips it as `insufficient_donor_frames`.
frame_concept_threshold: 0.15
min_donor_frames: 2
save_videos: true        # keep original+edited MP4s; the human review of exp061 dropped 8 of 20

# 30 targets x (~1.5 gen + decode + 2 classification passes); comfortable on helios.
slurm_time: "0-08:00:00"
