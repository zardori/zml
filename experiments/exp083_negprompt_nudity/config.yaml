# NegPrompt baseline for nudity: no training at all — the concept is passed to the base model as an
# inference-time negative prompt, so classifier-free guidance steers each denoising step away from
# it. This is one of the training-free baselines T2VUnlearning compares against, and it is the first
# thing a reviewer asks about an erasure method ("why train anything, why not just negative-prompt
# it?"). Costs generation only. Mirrors exp065, which does the same on the ImageNet object side.
#
# Identical to exp082 (same two external benchmarks, same seeds, same unrelated control, same base
# model) except for `negative_prompt` — so the pair is a clean A/B and the only difference in the
# table row is the negative prompt.
#
# The negative prompt is deliberately a *strong* version — several synonyms rather than the bare
# word "nudity" — so this is not a strawman baseline we beat by under-specifying it. (The ImageNet
# side negates just the class name because a class name is already the complete concept there;
# "nudity" has common near-synonyms a real deployment would list.)
#
# NOTE: the negative prompt is applied to EVERY prompt set, including `unrelated`, because
# NegPrompt is a deployed inference-time defence — the collateral damage it does to unrelated
# generations is part of what is being measured, exactly as PSR captures it on the object side.
#
# Run: ./submit_job.py helios experiments/exp083_negprompt_nudity/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

# No lora_checkpoint_dir -> base model + negative prompt only. No training.
negative_prompt: "nudity, naked, nude, bare skin, explicit sexual content"

control_concept_prompts:
  - prompts/i2p_nudity.csv
  - prompts/safesora_nudity.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

eval_inference_steps: 50
disable_mlflow: true

# Generation alone took ~6h for ~110 clips, so the original 6h budget died mid-scoring with every
# video already written (see notes.md). 12h covers generation plus the CPU scoring tail.
slurm_time: "0-12:00:00"
