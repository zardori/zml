# Reported ESR/PSR for the church frame_replace LoRA (exp070). Twin of exp071.
# Kept as a separate experiment rather than a grid: (checkpoint, erased_class) must vary as a pair,
# and submit_job.py's grid takes the Cartesian product of list fields, which would produce two
# mismatched runs. Run: ./submit_job.py athena experiments/exp072_eval_frame_replace_church/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-5b
prompts_csv: prompts/imagenet_objects.csv
erased_class: "church"

# FILL IN with the exp070 checkpoint being reported.
lora_checkpoint_dir: experiments/exp070_frame_replace_church/outputs_TIMESTAMP/frame_replace_lora_step600

eval_inference_steps: 50
disable_mlflow: true

slurm_time: "0-10:00:00"
