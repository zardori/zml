# NegPrompt baseline for the ImageNet object-erasure protocol (docs/imagenet_objects.md).
# No training: the erased class name is passed to the base model as an inference-time negative
# prompt (`negative_prompt: auto` resolves to `erased_class`). This is one of the three baselines
# T2VUnlearning compares against, and it costs only generation.
# `erased_class` is a list, so submit_job.py grids it into one job per pilot class.
# Run: ./submit_job.py athena experiments/exp065_negprompt_imagenet/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-5b
prompts_csv: prompts/imagenet_objects.csv
erased_class: ["chain saw", "church"]
negative_prompt: auto

eval_inference_steps: 50
disable_mlflow: true

# Run 1 TIMED OUT at 10 h with 163/200 (run_001) and 164/200 (run_002) videos and no esr_psr.json.
# Measured from video mtimes, both arms ran at 219 s/video, so a cold 200-video run needs ~12.2 h.
# Sized for a cold start, not for the resume: generation skips existing non-empty files, so the
# resubmission only has ~37 videos left per arm, but the config has to stay correct on its own.
#
# Note the rate is 2.1x exp064's (200 videos in 5.71 h = 103 s/video), same cluster, same 50 steps,
# same 200 prompts — a negative prompt adds no forward pass, so the cause is unexplained and is
# probably node-to-node variation or contention between the two concurrent grid arms. This is
# exactly what slurm/run_info.sh now records (node, cluster, elapsed, outcome) so the next such
# discrepancy is answerable instead of guessed at.
slurm_time: "0-14:00:00"
