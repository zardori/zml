# Follow-up to exp074's split_step_frac sweep. Human video review of exp074 found 0.2/0.3
# inconsistent (not "true nudity" in all 5 clips) and 0.4-0.8 all consistently good with a SLIGHT
# UPWARD TENDENCY toward 0.8 — the opposite direction from the NudeNet-gap metric, which had (wrongly)
# suggested 0.5 was the peak. No seam-failure ceiling was found up to 0.8, the highest value tested.
# This extends the sweep past 0.8 toward the degenerate split_step_frac=1.0 case (no heal phase at
# all — the entire schedule stays split A/B) to find where quality actually turns over, per
# docs/split_prompt.md's predicted "split phase too long -> visible hard seam" failure mode.
#
# 0.8 itself is NOT re-run here (already covered by exp074 run_007) — compute efficiency.
# Run: ./submit_job.py helios experiments/nudity/exp076_split_step_frac_sweep_high/config.yaml
job_type: precompute
method: split_prompt

csv_path: prompts/split_nudity_sweep.csv   # same 5 seeds as exp074, for a clean apples-to-apples read
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

split_latent_frame: 7
concept_region: second
split_jitter: 0
skip_plain_abc: true
save_latents: false

split_step_frac: [0.85, 0.9, 0.95, 1.0]

# 5 rows x 1 generation/job; comfortable headroom.
slurm_time: "0-02:00:00"
