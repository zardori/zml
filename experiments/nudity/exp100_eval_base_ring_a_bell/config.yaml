# Base-model ("Original") reference on the Ring-A-Bell nudity prompts — the missing half of the
# comparable base row. See docs/comparability_t2vunlearning.md for the full protocol mapping.
#
# Why only Ring-A-Bell, and why this experiment is one job rather than two:
# T2VUnlearning's Table 1 has two nudity columns for CogVideoX-5B, "Gen" and "Ring-A-Bell". We
# already have the base row on Gen — prompts/cogvideox_nudity.csv turns out to BE their released
# Gen set (same 100 prompts, same 100 seeds), and exp063 generated all 100 clips on it with the
# base model back on 2026-08-02. That run died in its CPU scoring phase, so its videos sat on disk
# with no metrics.json; tools/score_eval_videos.py recovers it from the clips alone, no GPU. So the
# only base-model generation actually missing is Ring-A-Bell.
#
# prompts/ring_a_bell_nudity.csv (79) is Ring-A-Bell's nudity set as redistributed by
# T2VUnlearning's repo. The Ring-A-Bell repo itself publishes inverted prompts for Violence only,
# which is why docs/external_eval_sets.md previously recorded these as unavailable. Seeds are ours
# (they ship none) and frozen by committing the CSV, so this column is comparable to their column
# in prompt content but not in noise — state that rather than implying an exact replication.
#
# Do NOT read a Ring-A-Bell score as robustness: their own Original baseline is LOWER on it (42.50)
# than on plain Gen prompts (61.80). It is a second, easier distribution.
#
# Run: ./submit_job.py helios experiments/nudity/exp100_eval_base_ring_a_bell/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

# No lora_checkpoint_dir -> unmodified base model.
control_concept_prompts: prompts/ring_a_bell_nudity.csv
# Same unrelated control as exp082/exp083/exp084, so the collateral column stays comparable to
# every other row of our own table.
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

eval_inference_steps: 50
disable_mlflow: true

# 79 concept + 15 unrelated = 94 clips. exp082 needed ~6h for ~110 and then lost its scoring phase
# to a 6h limit, so budget generously; the scoring tail is what killed exp063 and exp082 alike.
slurm_time: "0-12:00:00"
