# frame_replace on the gen5 UNIFORM-wardrobe dataset — the training arm of exp145.
#
# SINGLE VARIABLE vs exp110. Every training field below is copied from exp110 verbatim (eta 2.0,
# rank 8, lr 1e-4, 200 steps, fire retention at weight 1.0, velocity loss on original latents,
# timesteps 400-1000, seed 42). The ONLY difference is which dataset metadata_file/latents_dir
# point at: exp109's gen4 (40 garments) there, exp145's gen5 (3 near-identical navy pieces) here.
# So a difference in outcome is attributable to donor-wardrobe diversity and nothing else.
#
# BLOCKED ON exp145, TWICE. The dataset does not exist yet, and exp145's notes carry a hard gate:
# measure coherence with tools/analyze_edit_directions.py first (reference: OLD-31 0.714 at n=34,
# GEN4-100 0.605, CLEAN-75 0.615). If gen5 does not land clearly above 0.714 at n>=75 the
# manipulation failed at the data level and this run answers nothing — do not submit it to find out.
#
# eval_num_prompts IS 25, NOT 10. exp110's 10 produced two false "0.0000" checkpoints that were
# reported as a new best before the full sets contradicted them; 10 videos cannot resolve a
# detection rate. This is the one deliberate departure from exp110's config and it only affects
# monitoring, not training.
#
# THE PRESERVATION SETS ARE NOT OPTIONAL HERE. A uniform donor wardrobe makes "render this navy
# shirt" easier to learn than "do not render nudity", and exp113 already caught the gen4 checkpoint
# shifting colour on prompts containing no nudity (53.1 vs base 45.8). control_related_prompts and
# control_unrelated_prompts are what make that collateral visible during the run instead of after.
#
# READ THE RESULT AGAINST THE RIGHT QUESTION. The gap this line of work is chasing is NOT "gen4
# erases less" — exp123 r1 s80 (0.070) and exp136 r1 s200 (0.040) both erase deeper than exp080 r2
# s120 (0.120). It is that exp080 has a checkpoint that is erased AND sharp at once, while every
# gen4-derived run only erases inside the degeneracy trough and gives the erasure back as sharpness
# returns. So the checkpoint to look for is one with a low nudity_frame_rate at DOVER-t >= 0.058 —
# and DOVER reads 0.0 on helios (aarch64), so score it post-hoc with tools/score_dover.py.
#
# Run: ./submit_job.py helios experiments/nudity/exp146_frame_replace_nudity_gen5/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

# FILL AFTER exp145 REVIEW — the merged, human-filtered gen5 dataset.
metadata_file: experiments/nudity/exp145_split_nudity_gen5_uniform/combined_dataset/metadata.json
latents_dir: experiments/nudity/exp145_split_nudity_gen5_uniform/combined_dataset/latents

# Fire retention, unchanged from exp080/exp110. exp085 settled that a nudity-adjacent retention set
# cancels the erase term (11/20 of its anchors were exposed skin); exp041's fire anchors share
# nothing with the concept region, so they never pull back. Held fixed to keep one variable.
retention_metadata_file: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2.0

control_concept_prompts: prompts/cogvideox_nudity.csv
control_related_prompts: prompts/ring_a_bell_nudity_safe.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0
gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 10
timestep_min: 400
timestep_max: 1000

eval_num_prompts: 25
eval_inference_steps: 50
global_seed: 42

# exp110's own wall clock, plus margin for the larger eval (25 prompts x 3 sets vs 10 x 1).
slurm_time: "0-20:00:00"
