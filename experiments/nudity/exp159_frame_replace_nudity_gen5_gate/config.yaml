# frame_replace on gen5 with the AUTOMATED gate instead of hand review — the ablation arm.
#
# IDENTICAL to exp146 in every field except which gen5 subset it trains on. exp146 trains the 27
# clips a person hand-picked from shard 1; this trains the 155 that pass an automated A-side gate
# over all four shards, with nobody looking at a video. The pair answers a question that recurs for
# every dataset in this project, across three concepts: **is hand-reviewing a build worth the
# hours?** If this arm ties or wins, we stop reviewing.
#
# WHY THE GATE IS `original_max_confidence >= 0.3` AND NOTHING ELSE.
#   * It is the only criterion with measurable human agreement. Against the 50 labelled clips of
#     shard 1 it recovers 85% of the hand-picked set (precision 64%); the best single-threshold rule
#     over every other metadata field reaches 68% accuracy against a 54% keep-everything baseline,
#     i.e. hand review is essentially NOT reproducible from the metadata. The gate does not try.
#   * It is objective and it is about information content, not taste: it asks whether the base model
#     rendered the concept under prompt A at all. A clip where it did not has nothing to erase, so
#     it teaches a pure wardrobe/style edit — the exact failure mode a uniform-navy donor set is
#     most at risk of.
#   * NOTHING filters the edited side. Target "cleanliness" anti-correlates with results in our own
#     three datasets: CLEAN-75 has the lowest residual (mean frame conf 0.001) and performed worst,
#     OLD-31 has 0.044 and produced the best checkpoint, GEN4-100 has 0.089. The earlier claim that
#     old data had a 0.001 floor was that number mis-attributed. Clips where the concept survives
#     partially are also deliberately wanted — see exp146's notes on the curriculum idea.
#
# SINGLE VARIABLE vs exp110. Every training field below is copied from exp110 verbatim (eta 2.0,
# rank 8, lr 1e-4, 200 steps, fire retention at weight 1.0, velocity loss on original latents,
# timesteps 400-1000, seed 42). The ONLY difference is which dataset metadata_file/latents_dir
# point at: exp109's gen4 (40 garments) there, exp145's gen5 (3 near-identical navy pieces) here.
# So a difference in outcome is attributable to donor-wardrobe diversity and nothing else.
#
# exp145'S GATE PASSED (2026-08-23). On the screened 57, mean pairwise cosine between clip edit
# directions is 0.609, against 0.293 for OLD-31 and 0.154 for GEN4-100 — 2x the best previous
# dataset, 4x gen4. (Read pairwise cosine, not coherence: coherence is magnitude-weighted and reads
# a misleading 0.729 here. See exp145's notes.) Yield 57/200, against gen4's 63/200 under the same
# rule, so uniformity cost nothing.
#
# STILL BLOCKED ON: human review of those 57 edited clips, and the merge that builds
# combined_dataset/ from them on the cluster (see exp145's notes for both).
#
# ETA IS SWEPT, AND THAT IS THE ONE DEPARTURE FROM SINGLE-VARIABLE. gen5's edits are 2-3x larger
# than anything trained on before (LAB magnitude 28.3 vs OLD-31's 9.9, GEN4-100's 13.2). The erase
# push is eta * (donor - teacher), so at exp110's fixed eta 2.0 the model moves much faster per step
# and may pass its useful window long before step 120 — exp125 burned a run exactly this way when
# effective step size scaled unnoticed. eta 2.0 keeps the exact comparison against exp110; eta 1.0
# is the arm matched to the larger displacement. Caveat: magnitude is measured in decoded LAB
# pixels while training happens in latent/velocity space, so this is a proxy, not a guarantee.
#
# eval_num_prompts IS 25, NOT 10. exp110's 10 produced two false "0.0000" checkpoints that were
# reported as a new best before the full sets contradicted them; 10 videos cannot resolve a
# detection rate. This is the one deliberate departure from exp110's config and it only affects
# monitoring, not training.
#
# THE PRESERVATION SETS ARE NOT OPTIONAL HERE. A uniform donor wardrobe makes "render this navy
# shirt" easier to learn than "do not render nudity", and exp113 already caught the gen4 checkpoint
# shifting colour on prompts containing no nudity (53.1 vs base 45.8). control_related_prompts and
# control_unrelated_prompts are what make that collateral visible during the run instead of after.
#
# READ THE RESULT AGAINST THE RIGHT QUESTION. The gap this line of work is chasing is NOT "gen4
# erases less" — exp123 r1 s80 (0.070) and exp136 r1 s200 (0.040) both erase deeper than exp080 r2
# s120 (0.120). It is that exp080 has a checkpoint that is erased AND sharp at once, while every
# gen4-derived run only erases inside the degeneracy trough and gives the erasure back as sharpness
# returns. So the checkpoint to look for is one with a low nudity_frame_rate at DOVER-t >= 0.058 —
# and DOVER reads 0.0 on helios (aarch64), so score it post-hoc with tools/score_dover.py.
#
# Run: ./submit_job.py helios experiments/nudity/exp159_frame_replace_nudity_gen5_gate/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

# Built on the cluster from exp145's screened shards — merge_dataset.sh command in exp145's notes.
metadata_file: experiments/nudity/exp145_split_nudity_gen5_uniform/combined_dataset_gate/metadata.json
latents_dir: experiments/nudity/exp145_split_nudity_gen5_uniform/combined_dataset_gate/latents

# Fire retention, unchanged from exp080/exp110. exp085 settled that a nudity-adjacent retention set
# cancels the erase term (11/20 of its anchors were exposed skin); exp041's fire anchors share
# nothing with the concept region, so they never pull back. Held fixed to keep one variable.
retention_metadata_file: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: [1.0, 2.0]   # see the eta note in the header

control_concept_prompts: prompts/cogvideox_nudity.csv
control_related_prompts: prompts/ring_a_bell_nudity_safe.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0
gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 10
timestep_min: 400
timestep_max: 1000

eval_num_prompts: 25
eval_inference_steps: 50
global_seed: 42

# exp110's own wall clock, plus margin for the larger eval (25 prompts x 3 sets vs 10 x 1).
# Two eta values -> two jobs.
# WALL-CLOCK ACCOUNTING — this config timed out once; read before resubmitting.
# The 2026-08-25 submission was CANCELLED AT step ~145/200 DUE TO TIME LIMIT at 20h. The runs were
# never compute-bound: a training step costs ~37s, so 200 steps is ~2.1h. The other ~18h was
# EVALUATION — 14 evals x ~1.3h, because this config raised eval_num_prompts 10 -> 25 AND added the
# related/unrelated sets, at save_interval 10. Full 200 steps at this eval budget needs ~28h.
# plgrid-gpu-gh200 allows 2-00:00:00, so the fix is a bigger --time, not a smaller experiment.
# If you only need the checkpoint range that has ever produced a winner (s80-s140), the truncated
# run already covers it and a resubmission buys little — see notes.md.
slurm_time: "1-08:00:00"
