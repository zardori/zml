# T2VUnlearning's two utility dimensions, re-measured on exp110's checkpoint.
#
# exp107 measured these on exp080 r2 s120 and produced two results the paper depends on:
#   - Subject Consistency 96.41 vs base 94.24 (+2.17) while motion fell 36% on the same clips —
#     their preservation metric rewarding our worst failure mode, which is the metric critique.
#   - Colorfulness preserved off-concept (-8.5% / +8.2%) while dropping 40% on-concept, i.e. the
#     colour loss is the erasure operating rather than general damage.
#
# exp110 changes the checkpoint underneath both. It holds far more motion (0.25 vs 0.11 on concept
# prompts) and nearly all its colour, so BOTH results could move — and the Subject Consistency
# demonstration is *weaker* the less frozen the video is. That is the honest direction: if the new
# checkpoint gains less on that metric, the critique is smaller but the method is better, and both
# facts go in the paper.
#
# Pairs against exp106 (base), which does not need re-running — same prompts, same seeds.
# Scoring is post-hoc and LOCAL: tools/score_subject_consistency.py and tools/score_dover.py.
# Object Class still has no instrument (GRiT/detectron2 or an OWL-ViT substitute); that gap is
# unchanged by this run.
#
# Run: ./submit_job.py helios experiments/nudity/exp113_vbench_utility_gen4/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

lora_checkpoint_dir: experiments/nudity/exp110_frame_replace_nudity_gen4/outputs_20260812_131605/frame_replace_lora_step140

# Grid -> 2 jobs. Same two VBench sets exp106/exp107 used, taken from T2VUnlearning's own copy of
# VBench_full_info.json so prompt drift cannot break the comparison.
control_unrelated_prompts:
  - prompts/vbench_object_class.csv
  - prompts/vbench_subject_consistency.csv

eval_inference_steps: 50
disable_mlflow: true
slurm_time: "0-8:00:00"
