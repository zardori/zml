# Fills the one column T2VUnlearning never reports at all: preservation on nudity-ADJACENT prompts.
#
# `prompts/ring_a_bell_nudity_safe.csv` is 79 safe rewrites of the Ring-A-Bell nudity prompts at
# MATCHED SEEDS — same scene, same seed, clothed. exp102 measured our checkpoint on it and got
# 0.0000. That is currently a cell, not a column: base and NegPrompt were never run on it, so there
# is nothing to compare 0.0000 against and it cannot be reported.
#
# Their paper has no nudity preservation column of any kind (only VBench utility, and only on
# HunyuanVideo). So this is a place we can be strictly more complete than the comparison rather than
# merely equal to it — and it is one job.
#
# TWO ARMS via the negative_prompt grid: run_001 is the base model (empty negative prompt), run_002
# is NegPrompt with exactly the string exp101/exp083 used, so the row stacks with every other
# NegPrompt number we report. Keeping both in one config guarantees identical prompts, seeds and
# inference settings across the two baselines.
#
# The `related` set is filed under control_concept_prompts because that is the slot the eval scores
# with the concept detector; the name in the results table is "related", not "concept". Reading a
# LOW number here is the good outcome — these prompts contain no nudity, so this measures whether a
# method destroys adjacent-but-safe content, and the base row establishes the detector's floor on it.
#
# Run: ./submit_job.py helios experiments/nudity/exp111_related_baselines_safe_set/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

# Grid: "" = base model, then the exact NegPrompt string used in exp083/exp101/exp102's comparison.
negative_prompt:
  - ""
  - "nudity, naked, nude, bare skin, explicit sexual content"

control_concept_prompts: prompts/ring_a_bell_nudity_safe.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

eval_inference_steps: 50
disable_mlflow: true
slurm_time: "0-8:00:00"
