# Why does 34 distorted targets erase efficiently while 100 realistic ones don't? This run tests
# the leading explanation and half of the second one, in one grid.
#
# THE FINDING THAT MOTIVATES IT (2026-08-14, computed locally from exp109's metadata): the gen4
# training targets themselves read **0.198** tagged-frame fraction on the same NudeNet family the
# eval uses. The old dataset's clean 31 read **0.001**. And exp114's late phase converges to
# 0.19-0.27 — i.e. the run converges to the detector response OF ITS OWN SUPERVISION. Training
# longer cannot push the eval rate below what the targets carry; "they don't get more clothed with
# longer training" because the supervision itself reads one-fifth nude to the instrument. Whether
# that 0.198 is fitted-fabric false positives (human review says the clips look fine) is irrelevant
# to the loss: v-prediction SFT pulls generations toward those latents, and whatever fires NudeNet
# in the targets fires NudeNet in the outputs.
#
# The contamination is concentrated: 75 of the 100 targets are <=5% tagged, and that subset's floor
# is 0.0016 — identical to the old dataset. THE ONE CHANGED INPUT here is the dataset filtered to
# those 75 (metadata_human_filtered_clean_run00N.json, merged on the cluster).
#
# SECOND MECHANISM, tested by the eta arm: the erase push per example is
#     target - teacher = eta * (donor - teacher),
# so its magnitude scales with the donor gap. The old wardrobe was shapeless dark sacks — donors
# FAR from the nude teacher, huge push. gen4 is fitted clothing that deliberately keeps the shot
# and changes only wardrobe — donors CLOSE to the teacher, so eta=2 (tuned on the old data's gaps,
# never re-tuned) delivers a much smaller push. The [2.0, 3.0] grid separates the two mechanisms:
#   run_001 eta 2.0 -> tests the target-floor fix alone.
#   run_002 eta 3.0 -> floor fix + compensated push. If only this arm recovers erasure, the gap
#                      was the donor distance; if both do, the floor was the story.
#
# THIRD MECHANISM, not tested here, kept on record: a rank-8 LoRA learns the SHARED component of
# (donor - teacher) across the dataset. Old data was one wardrobe (sacks), so the shared component
# was "replace skin with cloth" and it generalized. gen4 spreads 8 wardrobes and varied colour by
# design, so per-example clothing directions partially cancel and the surviving shared component is
# style — which is exactly what exp113 measured the model absorbing (colour ABOVE base on unrelated
# sets, 53.1 vs 45.8). Meanwhile train/loss_erase falls smoothly as the example-specific residual
# is memorized (exp114's curve) without generalizing. If BOTH arms here stay weak, the next arm is
# a homogeneous low-floor wardrobe subset (outerwear+traditional, 26 clean targets).
#
# Ruled out already: per-example exposure (exp114's 500 steps matched the old per-example visit
# count and did not recover) and run noise (exp114 reproduces exp110 within 0.01-0.04).
#
# EVAL: eval_num_prompts 25, save_interval 20 — n=10 rankings produced two false "0.0000" claims
# (exp080's and exp110's, both read 0.10-0.15 on the full set). 25 prompts x 49 frames = 1225
# frames per point at roughly exp110's wall clock. Any winner still gets the full exp112 treatment
# before it is called better.
#
# Run (after cluster-side merge; see notes.md): ./submit_job.py helios experiments/nudity/exp123_gen4_clean_targets/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

metadata_file: experiments/nudity/exp109_split_nudity_gen4_dataset/combined_dataset_clean75/metadata.json
latents_dir: experiments/nudity/exp109_split_nudity_gen4_dataset/combined_dataset_clean75/latents

retention_metadata_file: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: [2.0, 3.0]   # grid; see header for what each arm isolates

control_concept_prompts: prompts/cogvideox_nudity.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 20

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 25   # n=10 cannot rank checkpoints — see header
eval_inference_steps: 50
global_seed: 42

slurm_time: "0-16:00:00"
