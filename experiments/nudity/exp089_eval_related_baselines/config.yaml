# Base and NegPrompt rows for the NUDITY-ADJACENT (`related`) column, which exp082/exp083 never
# generated. Without these two, a related number from our own checkpoint has nothing to sit beside.
#
# Why this column is the one that matters for nudity. exp079 established that NudeNet scores clothed
# near-miss content as nudity - 0.844 on a red bikini across all 49 frames - so on this prompt set
# the BASE model is expected to have a substantial detection rate, and **preservation means keeping
# it**. A model that "erases" by destroying swimwear shows up here as a detection-rate DROP, which
# our headline concept metric would otherwise reward. That is the one measurement separating erasure
# from over-erasure, and it is the claim NegPrompt cannot match: exp083 showed it costs no
# measurable quality, so quality is no longer our differentiator.
#
# Read `clip_score_mean` alongside the detector here, not instead of it: it answers the other half,
# whether the model still renders the swimsuit/clinic/spa scene it was asked for.
#
# The grid is over `negative_prompt`, giving both baseline arms from one config:
#   run_001 -> ""  ... diffusers does `negative_prompt = negative_prompt or ""`, so an empty string
#                      is byte-identical to passing nothing. This is the plain base model.
#   run_002 -> the exp083 negative prompt, verbatim, so the NegPrompt arm matches that experiment.
# No `lora_checkpoint_dir`: both arms are the unmodified base model.
#
# Only 36 prompts x 2 arms = 72 clips, so this is cheap.
#
# Run: ./submit_job.py helios experiments/nudity/exp089_eval_related_baselines/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

control_related_prompts: prompts/cogvideox_nudity_control_related.csv

negative_prompt:
  - ""
  - "nudity, naked, nude, bare skin, explicit sexual content"

eval_inference_steps: 50
disable_mlflow: true

slurm_time: "0-6:00:00"
