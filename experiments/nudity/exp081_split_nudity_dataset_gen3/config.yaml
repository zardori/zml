# Third-generation frame_replace dataset for nudity. exp078 (gen2, 50 triples: close-up +
# multi-person + wording-diverse) came back from human review with multi-person the clear best
# performer (40% approved on the split_step_frac=1.0 run) and tight close-up crops the clear worst
# (13.3%). This batch acts on that signal instead of repeating gen2's even 3-way split: scale up
# multi-person and creative full-body settings, de-emphasize tight crops (the close-up rows here
# use a looser "medium close" framing on a two-region body area instead of an isolated crop).
#
# prompts/split_nudity_gen3.csv, 55 new triples, seeds 3701-3755 (no collision with
# split_nudity.csv 3101-3170 or split_nudity_gen2.csv 3401-3620). Unlike v1 of this dataset (built
# from a single sentence skeleton with nouns substituted from list pools — correctly rejected as
# lazy, and close to the exact "model latches onto training phrasing" failure mode exp078's own
# wording-diverse batch existed to fix), every row here is its own hand-written sentence: no two
# rows share sentence structure, clause order, or scene-description style, only the required
# "static/fixed camera" constraint (needed for the split sampler's temporal splice) repeats as a
# semantic requirement, phrased differently almost every time.
#   - 3701-3723 (23): multi-person, unusual-but-plausible scenarios (bathhouse, life-drawing
#     studio, decompression chamber, greenhouse at midnight, backstage dressing room, submarine
#     berth, blacksmith's forge, glassblowing kiln, ice hotel, daguerreotype-era portrait studio,
#     apiary washstand, mountain-spring bathing, tattoo studio, hotel room, potter's wheel, dressing
#     room, boathouse dock, opera backstage, barn trough, museum vault, yoga studio).
#   - 3724-3744 (21): single-person full-body/medium, creative settings (lighthouse tower,
#     recording booth, conservatory koi pond, observatory dome, mine tunnel, planetarium booth,
#     ice cave, barn tightrope practice, wine cellar, bank vault, houseboat deck, cinema projection
#     booth, vintage train car, falconer's mews, greenhouse potting shed, clockmaker's workbench,
#     abandoned opera box, apiary, submarine engine room, sculptor's studio, frozen lake).
#   - 3745-3755 (11): medium-close, two-region crops (shoulders+upper back, torso+hips,
#     chest+stomach, hips+lower back, back+shoulder blades, chest+collarbone, hips+thighs,
#     torso+hips, shoulders+upper back, chest+stomach, hips+lower back) — deliberately looser than
#     exp078's single-region tight crop, testing whether crop tightness itself was the close-up
#     failure mode.
#
# split_step_frac: NOT YET SET. exp078's grid [0.8, 0.85, 0.9, 0.95, 1.0] is still only half
# reviewed (run_005 @ 1.0: 26% approved; run_001-004 @ 0.8/0.85/0.9/0.95: review in progress as of
# 2026-08-06) — fill this in once a final value is picked from that comparison, per
# docs/split_prompt.md and exp078/notes.md. Placeholder below is exp078's pre-review best-confirmed
# generic value (exp076); DO NOT submit on the placeholder without checking exp078's review first.
#
# Run: ./submit_job.py helios experiments/nudity/exp081_split_nudity_dataset_gen3/config.yaml
job_type: precompute
method: frame_replace_split

csv_path: prompts/split_nudity_gen3.csv   # 55 A/B/C triples: 23 multi-person, 21 single-person, 11 medium-close

model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Split sampler + de-biasing knobs. Same policy as exp061/exp078.
split_latent_frame: 7
concept_region: random
split_jitter: 2
split_step_frac: 0.85   # TODO: replace with exp078's final picked value once run_001-004 review lands

# Mask is derived from (split_latent_frame, concept_region) since the 2026-08-04 fix, not from
# detection (see docs/split_prompt.md). Detector still runs and logs frame_confidences for human
# review but no longer gates keep/skip, so yield should again be close to 100%.
frame_nudity_threshold: 0.3
min_donor_frames: 2
boundary_margin: 2
concept: nudity
save_videos: true        # needed for the same human review pass exp061/exp078 got

# 55 targets, same per-target cost as exp078 (~7.5 min/target observed there) -> budget with margin.
slurm_time: "0-8:00:00"
