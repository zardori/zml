# exp110 for 500 steps instead of 200 — does the still-falling loss lead anywhere?
#
# WHY. exp110's training loss was not converged at step 200: 0.489 -> 0.445 -> 0.457 -> 0.400 across
# its four logged windows, minimum at the last one, with loss_erase down 21% (0.4075 -> 0.3207) and
# loss_retain flat at ~0.08. The model is still learning the erase objective when the run stops.
#
# WHY THAT MIGHT NOT MATTER, stated up front. Train loss and eval erasure have been *anti*-correlated
# in this method. exp062 is the only long-run evidence in the thread and all three of its arms got
# monotonically worse with more steps:
#
#     step:      100    200    300    400    600
#     arm 1:    0.07   0.17   0.58   0.53   0.64
#     arm 2:    0.33   0.62   0.49   0.61   0.69
#     arm 3:    0.31   0.26   0.50   0.31   0.37
#
# exp110 itself already shows the same shape in miniature — 0.0000 at step 140, then 0.21 at 150 and
# 0.23 at 170, settling at 0.12. So the honest prior is that 500 steps ends worse than step 140 does.
#
# WHY RUN IT ANYWAY. exp110's U is far flatter than any previous run (rebound peaks at 0.23 where
# every other arm reached 0.49-0.76) and it is on a different dataset than exp062 by two generations.
# "The loss is still falling and nobody has looked past 200 steps on good data" is a legitimate
# question, and it is one job. If erasure decays as exp062 predicts, that closes the step-count
# question for the paper with evidence instead of an assumption.
#
# DESIGN. Identical to exp110 in every field except `steps` and `save_interval` — same data, same
# fire retention, same eta 2.0, same lr, same global_seed. Trained fresh rather than resumed, so the
# first 200 steps should reproduce exp110's trajectory; where they diverge is a reproducibility
# check worth having.
#
# save_interval 20 rather than exp110's 10: 25 evals keeps the job inside a sane wall clock
# (exp110 took ~8.5h for 200 steps + 20 evals) and aligns with exp110's grid at every 20 steps, so
# the two trajectories overlay directly on the shared points.
#
# Run: ./submit_job.py helios experiments/nudity/exp114_gen4_long_training/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

# THE ONE CHANGED FIELD PAIR. exp109's 100 reviewed gen4 targets, merged on the cluster from the
# four shards' filtered metadata. combined_dataset/ is gitignored, so this path exists only there —
# the git-tracked record of what went in is exp109's four metadata_human_filtered_run00N.json.
metadata_file: experiments/nudity/exp109_split_nudity_gen4_dataset/combined_dataset/metadata.json
latents_dir: experiments/nudity/exp109_split_nudity_gen4_dataset/combined_dataset/latents

# Unchanged from exp080 run_002 — exp041's fire anchors. exp085 (nudity-adjacent anchors) and
# exp105/exp108 (clothed anchors) have both now failed to beat these, for the same reason: anything
# sharing human-body features with the concept competes with the erase term.
retention_metadata_file: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2.0

control_concept_prompts: prompts/cogvideox_nudity.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 500
# 20, not exp110's 10 — see the header. 25 evals over 500 steps keeps the wall clock sane and still
# lands on exp110's grid at every 20 steps, so the shared range overlays directly. The cost is
# resolution: exp110's good window (90-140) is sampled at 100/120/140 here rather than every step,
# which is acceptable because this run is asking about steps 200-500, not about that window.
save_interval: 20

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

slurm_time: "0-22:00:00"
