# The candidate for the REPORTED checkpoint: exp080's regime on a dataset whose targets are no
# longer frozen.
#
# exp080 trained on 34 triples of which 20 (59%) had a single repeated donor frame, and collapsed
# concept motion to -87%..-99% against a base of 0.686 while leaving unrelated motion untouched.
# exp087 re-edited those 21 from their saved originals with edit_latent_reflected: frozen targets
# 20/21 -> 0/21, edit/safe motion ratio 0.01 -> 1.00, and 7 detector-derived concept masks corrected
# to construction (with nonfire_frame_weight: 0.0 those were hard-masking the erase loss onto the
# wrong frames for a third of the data).
#
# Both previously-blocking fields are now decided by exp085/exp086 + human review (2026-08-10):
#
#   erase_esd_eta -> [1.5, 2.0]. Human review kept exp080 run_002 (eta 2.0) as the best checkpoint
#     to date, and of exp086's arms only eta 1.5 came close. Carrying both keeps a direct 2x2
#     against runs we already have on the OLD data at the same lr and retention set
#     (exp080 run_002 = eta 2.0, exp086 run_003 = eta 1.5), so the dataset is the only variable.
#
#   retention -> exp041 (fire), UNCHANGED. exp085 settled that exp079's set is not the answer: its
#     human-filtered 20 entries are 11/20 exposed-skin wardrobe, so retention was pulling toward
#     keeping exposed torsos while the erase term pushed away from the same features. exp104 builds
#     a fully-clothed replacement and exp105 tests it — on the OLD data, so that arm isolates the
#     retention variable exactly as this one isolates the data variable. Changing retention here too
#     would confound both.
#
# Run: ./submit_job.py helios experiments/exp088_frame_replace_nudity_clean/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

# exp087's re-edited 21 + exp078's already-clean 13 = the same 34 triples exp080 used, rebuilt.
metadata_file: experiments/exp087_reedit_exp061_reflected/combined_dataset/metadata.json
latents_dir: experiments/exp087_reedit_exp061_reflected/combined_dataset/latents

# Held fixed at exp041's fire anchors so this arm is a clean read on the DATA change. exp105 varies
# retention instead, on exp080's old data.
retention_metadata_file: experiments/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
# The two arms that worked on the old data (see the header). Both carried because eta's benefit is
# partly "do not overfit a frozen donor", and that benefit shrinks once the donors are not frozen —
# so the optimum may well move on this data, and one point could not show it.
erase_esd_eta: [1.5, 2.0]

# Concept only, as in exp085/exp086: this is a mechanism run and the preservation column comes from
# the external-benchmark eval of whichever checkpoint it produces.
control_concept_prompts: prompts/cogvideox_nudity.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 10   # 20 evals; exp080's good state was a ~40-step window that 20-step checkpoints straddled

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

slurm_time: "0-16:00:00"
