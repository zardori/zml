method: frame_replace
model_id: THUDM/CogVideoX-5b

# Same data as exp046: curated fire targets with pre-edit original latents, exp041 retention.
metadata_file: experiments/archive/frame_replace_fire/exp042_frame_replace_precompute_curated/outputs_20260625_215904/metadata.json
latents_dir: experiments/archive/frame_replace_fire/exp042_frame_replace_precompute_curated/outputs_20260625_215904/latents
retention_metadata_file: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/shared/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

# Objective unchanged from exp046 — the redirection that produced the step-500 erasure.
nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity

control_concept_prompts: prompts/cogvideox_fire_control_fire.csv
control_related_prompts: prompts/cogvideox_fire_control_related.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

# THE variables under test: average 4 independent samples per optimizer step and anneal the
# LR (5e-4 -> 2.5e-5 cosine). exp046 with batch-1 constant-LR SGD oscillated through the
# erasure basin (detection 1.0 -> 0.0 -> 0.6 across checkpoints) instead of settling in it.
gradient_accumulation_steps: 4
lr_scheduler: cosine
learning_rate: 0.0005

# 600 optimizer steps x 4 micro-steps = 2400 erase samples, ~2.4x exp046's exposure; the
# interesting region in exp046 was steps 300-600.
steps: 600
save_interval: 100

timestep_min: 0
timestep_max: 1000

# 10 eval prompts (up from 5): halves detection-rate granularity to +-0.1 so the trend is
# readable against the oscillation we are trying to remove.
eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

slurm_time: "1-00:00:00"
