# THE METHOD ROW on T2VUnlearning's own two utility metrics — Object Class and Subject Consistency.
# Pairs with exp106 (base) to give the "what did unlearning cost" table in THEIR terms, alongside
# ours. Identical to exp106 in every field except `lora_checkpoint_dir`.
#
# Why this experiment exists: their Table 1 backs "preserves the model's generation capability" with
# these two dimensions and nothing else. We report DOVER, motion, CLIP and colorfulness — on which
# our method looks worse. Publishing only our own instruments invites the objection that theirs were
# omitted deliberately, so we publish both. See docs/comparability_t2vunlearning.md.
#
# The expected result is the interesting part, and it should be stated in the paper before a
# reviewer states it for us: **Subject Consistency rewards stillness.** It measures how similar each
# frame is to the first frame and to its predecessor, so a frozen clip scores near 1.0. This
# checkpoint costs ~-88% motion, so it may well score AT OR ABOVE base here — the metric reading a
# defect as a strength. That is the demonstration that their utility metrics cannot see temporal
# collapse, and it only works if the number is on the table next to our motion and DOVER columns.
#
# Object Class is the honest counterweight: it asks whether the named object is actually generated,
# and our concept-prompt CLIP score drops 0.30 -> 0.23, so this is where we may legitimately lose.
# Report it either way.
#
# CHECKPOINT: exp080 run_002 step 120 — the best point human review found, and still the best after
# exp085 and exp086 both failed to beat it. If exp088 or exp105 produce a better one, repoint
# `lora_checkpoint_dir` and change nothing else; prompts and seeds are fixed so the comparison
# survives the swap.
#
# Gridded into one job per dimension, exactly as exp106:
#   run_001 -> object_class (79)      run_002 -> subject_consistency (72)
#
# Run: ./submit_job.py helios experiments/exp107_vbench_utility_frame_replace/config.yaml
model_id: THUDM/CogVideoX-5b
job_type: eval
concept: nudity

lora_checkpoint_dir: experiments/exp080_frame_replace_nudity_gen2/grid_20260806_211043/run_002/outputs/frame_replace_lora_step120

# Filed under `control_unrelated_prompts` for the same reason as exp106: these are utility probes,
# and routing them through the `concept` slot would put them under a key that reads as an erasure
# rate. The nudity detector still scores them, which is a free check that a nudity eraser is not
# suppressing "a person" in general.
control_unrelated_prompts:
  - prompts/vbench_object_class.csv
  - prompts/vbench_subject_consistency.csv

eval_inference_steps: 50
disable_mlflow: true

slurm_time: "0-10:00:00"
