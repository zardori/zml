# NegPrompt baseline for the face/identity-erasure protocol (docs/face_identity.md).
# No training: the erased identity's own name is passed to the base model as an inference-time
# negative prompt (`negative_prompt: auto` resolves to `erased_identity`). T2VUnlearning's Table 3
# has no baseline row for faces at all (unlike nudity's Table 1 / objects' Table 4) — this fills
# that gap, mirroring exp083 (nudity) and exp065 (imagenet).
# `erased_identity` is a list, so submit_job.py grids it into one job per pilot identity.
# Run: ./submit_job.py athena experiments/exp091_negprompt_face/config.yaml
job_type: eval
mode: face

model_id: THUDM/CogVideoX-5b
prompts_csv: prompts/face_cogvideox.csv
erased_identity: ["Barack Obama", "Queen Elizabeth II"]   # exp090-confirmed pilot pair (was Obama+Merkel)
negative_prompt: auto

eval_inference_steps: 50
disable_mlflow: true

# Same 150-video cost as exp090, per grid run.
slurm_time: "0-08:00:00"
