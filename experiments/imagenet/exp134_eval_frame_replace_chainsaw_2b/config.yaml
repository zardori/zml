# Reported ESR/PSR for the 2B chain-saw frame_replace LoRA (exp133) -- the 2B counterpart of
# exp071, and the number GOAL.md's target table is compared against. exp133's live eval only
# scores 9 concept prompts and 9 collateral prompts; the published metric needs all 200 prompts
# generated by the *unlearned* model, which is this run.
# Run: ./submit_job.py athena experiments/imagenet/exp134_eval_frame_replace_chainsaw_2b/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-2b
prompts_csv: prompts/imagenet_objects.csv
erased_class: "chain saw"

# exp133's FINAL checkpoint. Same "no reason to deviate" logic as exp071: the live monitor is flat
# at concept top-1 0.00 from step 200 through step 600, so picking among the six checkpoints would
# be selection on the eval set for no measurable gain.
lora_checkpoint_dir: experiments/imagenet/exp133_frame_replace_chainsaw_2b/outputs_20260820_181735/frame_replace_lora_step600

eval_inference_steps: 50
disable_mlflow: true

# exp130 (2B base model, identical 200-video protocol) measured 4.6h on athena. exp071's LoRA eval
# on 5b ran 2.4x its own base-eval measurement (13.6h vs exp064's 5.71h) -- applying that ratio to
# 2B's 4.6h base projects ~11h, uncomfortably close to a 10h cap, and LoRA forward-pass overhead is
# not guaranteed to shrink with model size. Matching exp071's own allotment (14h) rather than
# exp130's, for the same reason exp071 raised it in the first place: exp065 timed out at 163/200 in
# 10h on these exact 200 prompts. Resumable if it runs out of wall clock regardless.
slurm_time: "0-14:00:00"
