# exp165's step-150 checkpoint -- eval-only diagnostic, no new training.
lora_checkpoint_dir: experiments/imagenet/exp165_frame_replace_chainsaw_void_rank32_finegrained_2b/outputs_20260827_071726/frame_replace_lora_step150

eval_inference_steps: 50
disable_mlflow: true

# Matching exp161/exp162/exp163/exp164's allotment for the identical eval workload (same model,
# same 200-prompt protocol -- only the LoRA weights differ).
slurm_time: "0-14:00:00"
