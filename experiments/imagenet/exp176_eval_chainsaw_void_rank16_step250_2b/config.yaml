# Full 200-prompt esr_psr eval of exp173's chain-saw void-target LoRA at RANK 16, step 250 -- the
# upper bracket of the step-200 ESR-5 peak both other ranks on exp156's void dataset showed. On
# rank 32 the peak was narrow: exp169 (step 250) collapsed to ESR-5 15.00, well below step 200's
# 43.57. This run tests whether rank 16's peak is similarly narrow or broad enough that step 250
# keeps a usable fraction of it, and whether erased-class motion has recovered by this trailing
# checkpoint (rank 32's did: exp169 motion 0.3645).
#
# Pure eval-only diagnostic: exp173's checkpoints already exist on disk, no new training needed.
# Run with exp174/exp175/exp177 -- independent evals, no dependency between them.
#
# Run: ./submit_job.py helios experiments/imagenet/exp176_eval_chainsaw_void_rank16_step250_2b/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-2b
prompts_csv: prompts/imagenet_objects.csv
erased_class: "chain saw"

lora_checkpoint_dir: experiments/imagenet/exp173_frame_replace_chainsaw_void_rank16_finegrained_2b/outputs_20260828_003723/frame_replace_lora_step250

eval_inference_steps: 50
disable_mlflow: true

# Matching exp170/exp171's allotment for the identical eval workload (same model, same 200-prompt
# protocol, same checkpoint architecture -- only the LoRA weights differ).
slurm_time: "0-14:00:00"
