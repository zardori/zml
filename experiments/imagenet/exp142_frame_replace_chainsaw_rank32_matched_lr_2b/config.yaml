# frame_replace erasure of CHAIN SAW on CogVideoX-2B: LoRA rank 8 -> 32, but UNLIKE exp141, every
# other field is left field-for-field exp139's (lr 0.0005 unscaled, steps 600, save_interval 100).
#
# exp141 tried rank 32 with lr scaled down by 8/32=0.25 (a rule borrowed from the nudity thread's
# exp129) and steps doubled 600->1200 up front. It never converged: live concept top-1 oscillated
# 0.07/0.31/0.30/0.11/0.11/0.20 across all six checkpoints and never reached 0.00, where every
# rank-8/eta-2.0 run (exp133, exp135, exp139) hits 0.00 by step ~150-200 and holds. Per exp141's
# own pre-registered falsifier, that reads as the scaled-down lr undertraining rank 32 relative to
# its budget, not as evidence capacity doesn't help -- exp141 explicitly withheld the full esr_psr
# eval on that basis.
#
# Rather than guess a second lr/step correction (which is what the nudity thread's exp136 had to
# do after its own first rank-32 attempt undershot), this run isolates rank as the ONLY variable:
# same lr, same steps, same save_interval as exp139, which is already known to converge cleanly at
# rank 8. If capacity helps, this run should converge AT LEAST as fast as exp139's rank-8 baseline
# (top-1 0.00 by step ~100-200) and the question becomes whether top-5 (the metric every lever so
# far has failed to move) drops further than exp139/exp140's ~0.11-0.28 restricted-top5 range. If
# it does not converge at exp139's own recipe either, that is a much stronger statement about rank
# than exp141 could make, because there is no lr-scaling confound left to blame.
#
# Run: ./submit_job.py helios experiments/imagenet/exp142_frame_replace_chainsaw_rank32_matched_lr_2b/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-2b
concept: object
concept_target: "chain saw"

# Same merged dataset as exp139/exp141: exp131's 25 screened rows (primary) + exp138's 22 screened
# rows (extra_sources_file), 47 rows total, 24 first / 23 second half.
metadata_file: experiments/imagenet/exp131_split_chainsaw_2b/outputs_20260820_103524_screened.json
latents_dir: experiments/imagenet/exp131_split_chainsaw_2b/outputs_20260820_103524/latents
extra_sources_file: experiments/imagenet/exp139_frame_replace_chainsaw_2b_gen2/extra_sources.json

# exp132's 2B preservation anchors, unchanged from exp133/exp139/exp141.
retention_metadata_file: experiments/imagenet/exp132_imagenet_preservation_2b/outputs_20260820_114124/metadata.json
retention_latents_dir: experiments/imagenet/exp132_imagenet_preservation_2b/outputs_20260820_114124/latents
retention_exclude: "chain saw"
retention_weight: 1.0

# Unchanged: eta=2.0 is the established stable baseline, closed as a lever by exp137.
nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2

# Same eval prompts as exp133/exp134/exp139/exp140/exp141, for an apples-to-apples live-monitor
# comparison.
control_concept_prompts: prompts/imagenet_objects/chain_saw.csv
control_related_prompts: prompts/imagenet_objects/others_chain_saw.csv
control_unrelated_prompts: prompts/imagenet_objects/others_chain_saw.csv

# THE VARIABLE: rank 8 -> 32, alpha held at ratio 1 (8->32), same convention as exp141.
lora_rank: 32
lora_alpha: 32.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
# UNCHANGED from exp139 (0.0005) -- exp141 scaled this to 0.000125 and never converged; this run
# removes that confound entirely rather than guessing a second scaling factor.
learning_rate: 0.0005
# UNCHANGED from exp139 (600) -- same reasoning as learning_rate above.
steps: 600
save_interval: 100

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 9
eval_inference_steps: 50
global_seed: 42

# exp139 (identical lr/steps/dataset, rank 8) ran 3.7h on helios. Rank 32 adds a small fixed
# per-step overhead (larger LoRA matmuls) but the step count and dataset are unchanged from exp139,
# so budgeting close to exp139's runtime plus headroom (exp141's rank-32 run at 2x the steps took
# 6.0h, i.e. ~3h per 600 steps at rank 32 -- consistent with exp139's 3.7h, so no large per-step
# slowdown from rank alone).
slurm_time: "06:00:00"
