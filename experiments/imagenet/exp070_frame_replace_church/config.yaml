# frame_replace erasure of the CHURCH class, in the same regime as exp069.
# Run: ./submit_job.py helios experiments/imagenet/exp070_frame_replace_church/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: object
concept_target: "church"

# FILL IN with exp067's outputs_{timestamp}.
metadata_file: experiments/imagenet/exp067_split_church_dataset/outputs_TIMESTAMP/metadata.json
latents_dir: experiments/imagenet/exp067_split_church_dataset/outputs_TIMESTAMP/latents

# FILL IN with exp068's outputs_{timestamp}; shared with exp069, only the exclusion differs.
retention_metadata_file: experiments/imagenet/exp068_imagenet_preservation/outputs_TIMESTAMP/metadata.json
retention_latents_dir: experiments/imagenet/exp068_imagenet_preservation/outputs_TIMESTAMP/latents
retention_exclude: "church"
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2

control_concept_prompts: prompts/imagenet_objects/church.csv
control_related_prompts: prompts/imagenet_objects/others_church.csv   # required slot, unscored in training
control_unrelated_prompts: prompts/imagenet_objects/others_church.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0005
steps: 600
save_interval: 100

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 9
eval_inference_steps: 50
global_seed: 42

slurm_time: "16:00:00"
