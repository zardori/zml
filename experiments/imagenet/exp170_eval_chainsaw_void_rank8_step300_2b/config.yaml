# Full 200-prompt esr_psr eval of exp157's chain-saw void-target LoRA (rank 8 / eta 2.0) at its
# step-300 checkpoint (halfway through the 600-step run). exp158 reported only the FINAL checkpoint
# (step 600): restricted ESR-1 70.92, ESR-5 15.41, PSR-1 85.95, PSR-5 95.44 -- a clean win over the
# random-distractor baseline (exp134: 49.90/15.61/82.71/93.19) on ESR-1 and both PSR cells, but
# ESR-5 flat. Early stopping is the one lever that has moved ESR-5 substantially elsewhere in this
# thread on OTHER datasets/ranks (rank 32 random-distractor: exp143's step-600 20.92 -> exp150's
# step-300 38.67; rank 64 random-distractor: exp148's step-600 16.43 -> exp153's step-100 44.49),
# but it has never been tried on the void-target dataset at rank 8 -- exp157 only ever evaluated
# its final checkpoint. This is the untested combination: does early stopping rescue void+rank8's
# flat ESR-5 the way it helped rank 32/64 on the random-distractor dataset, or does it interfere
# the way rank 32 + void did when the two levers were stacked (exp160-exp169: void+rank32 never
# beat rank-32-alone's own early-stop optimum at any step)?
#
# Pure eval-only diagnostic: exp157's checkpoints already exist on disk, no new training needed.
# Run with exp171 (step 200) and exp172 (step 100) -- independent evals of exp157's saved
# checkpoints, no dependency between them.
#
# Run: ./submit_job.py helios experiments/imagenet/exp170_eval_chainsaw_void_rank8_step300_2b/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-2b
prompts_csv: prompts/imagenet_objects.csv
erased_class: "chain saw"

# exp157's step-300 checkpoint -- eval-only diagnostic, no new training.
lora_checkpoint_dir: experiments/imagenet/exp157_frame_replace_chainsaw_void_2b/outputs_20260826_081121/frame_replace_lora_step300

eval_inference_steps: 50
disable_mlflow: true

# Matching exp158's allotment for the identical eval workload (same model, same 200-prompt
# protocol, same checkpoint architecture -- only the LoRA weights differ).
slurm_time: "0-14:00:00"
