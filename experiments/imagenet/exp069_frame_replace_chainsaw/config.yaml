# frame_replace erasure of the CHAIN SAW class, in exp057/exp062's eta=2 regime.
# Everything except the dataset, the concept and the retention set is field-for-field identical to
# exp062 (nudity), so a difference in outcome is attributable to the concept, not the recipe.
#
# Unblocked by exp117: the object prompt reframe took the chain-saw dataset from 7/30 usable to
# 14/30, which with exp066's 7 surviving rows is enough to train on.
# Run: ./submit_job.py helios experiments/imagenet/exp069_frame_replace_chainsaw/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: object            # live eval scores with the per-frame ResNet-50 classifier
concept_target: "chain saw"

# 21 screened rows: exp117's 14 (object-dominant prompts) plus exp066 run 2's 7 (the original wide
# framing). Both were selected by tools/screen_split_dataset.py at --min-concept-max 0.10, so every
# row is a clip where prompt A's half reads as chain saw and prompt B's half does not.
#
# Merging rather than using exp117 alone, for two reasons. Twenty-one rows against fourteen matters
# at this size (exp062, the run this recipe is copied from, trained on 31). And exp066's rows are
# *wide* framings, which is the only counterweight to overfitting the closeup template ("in close
# view, filling much of the frame", static camera) that exp117's prompts all share — the 20 eval
# prompts are ordinary scenes, so a LoRA that only ever saw frame-filling objects is being asked to
# generalise across framing. The two sources also balance the positional shortcut: 6 first / 8 second
# and 4 first / 3 second merge to 10 / 11.
#
# Build the merged dataset on the cluster BEFORE submitting (combined_dataset/ is gitignored and the
# .pt latents only exist there):
#   ./merge_dataset.sh --cluster helios \
#     --output experiments/imagenet/exp069_frame_replace_chainsaw/combined_dataset \
#     --source experiments/imagenet/exp117_split_chainsaw_closeup/outputs_20260815_014333_screened.json \
#              experiments/imagenet/exp117_split_chainsaw_closeup/outputs_20260815_014333/latents \
#     --source experiments/imagenet/exp066_split_chainsaw_dataset/outputs_20260808_235138_screened.json \
#              experiments/imagenet/exp066_split_chainsaw_dataset/outputs_20260808_235138/latents
metadata_file: experiments/imagenet/exp069_frame_replace_chainsaw/combined_dataset/metadata.json
latents_dir: experiments/imagenet/exp069_frame_replace_chainsaw/combined_dataset/latents

# Retention: the nine preserved classes. `retention_exclude` drops chain-saw anchors, which would
# otherwise pull directly against the erase branch.
retention_metadata_file: experiments/imagenet/exp068_imagenet_preservation/outputs_20260803_233647/metadata.json
retention_latents_dir: experiments/imagenet/exp068_imagenet_preservation/outputs_20260803_233647/latents
retention_exclude: "chain saw"
retention_weight: 1.0

# Same erase regime as exp057/exp062 (interpolated targets, eta=2).
nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2

# Live-eval sets. The concept set is the 20 full chain-saw eval prompts — none of which has an
# object-free half — so erasure here is also the positional-shortcut test: a LoRA that only learned
# "copy the other half" fails on them. `others_chain_saw.csv` holds one prompt per preserved class.
control_concept_prompts: prompts/imagenet_objects/chain_saw.csv
control_related_prompts: prompts/imagenet_objects/others_chain_saw.csv   # required slot, unscored in training
control_unrelated_prompts: prompts/imagenet_objects/others_chain_saw.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0005
steps: 600
save_interval: 100

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 9
eval_inference_steps: 50
global_seed: 42

# exp062 (600 steps, same eval cadence) ran 10.9 h against a 16 h allotment.
slurm_time: "16:00:00"
