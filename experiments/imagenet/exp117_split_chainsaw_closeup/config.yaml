# frame_replace dataset for CHAIN SAW, rebuilt on object-dominant prompts.
#
# exp066 run 2 screened at 7/30 usable, and tools/screen_split_dataset.py attributes 17 of the 30 to
# a single cause: the base model never rendered a chain saw anywhere in the clip. The splitter cannot
# separate a concept that was not drawn, so this run changes the prompts and nothing else. Same 30
# settings, same seeds, same prompt C, same sampler knobs — only A and B are reframed close and given
# the class-identifying detail the eval prompts have (tools/build_split_imagenet_closeup_prompts.py).
# Precedent: exp116 did exactly this for faces and took yield from 30% to 50-63%.
#
# Run: ./submit_job.py helios experiments/imagenet/exp117_split_chainsaw_closeup/config.yaml
job_type: precompute
method: frame_replace_split

csv_path: prompts/imagenet_objects/split/chain_saw_closeup.csv   # 30 A/B/C triples, seeds 3201-3230
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Identical to exp066 run 2, so the comparison isolates the prompts.
split_latent_frame: 7
concept_region: random
split_jitter: 1
split_step_frac: 0.85
boundary_margin: 2
tail_prompt_mode: c

concept: object
concept_target: "chain saw"
# LOGGING ONLY since 543eed8 — the mask is derived from (split_latent_frame, concept_region). These
# confidences are what tools/screen_split_dataset.py screens on afterwards, which is the one place
# the detector is allowed to decide anything.
frame_concept_threshold: 0.05
min_donor_frames: 2
save_videos: true

# Also emit the whole-clip variant: prompt A's plain clip as the original, prompt B's same-seed plain
# clip as the donor. Two reasons beyond the face thread's. (1) It is the diagnosis, for free — the
# A-side confidences say whether the base model can render a chain saw for this (prompt, seed) at
# all, separating a prompt failure from a splitter failure without a second job. (2) It is a
# seam-free fallback target: A and B differ by one noun under one seed, which is about as controlled
# a counterfactual pair as this setup can produce, and it does not depend on the splice working.
emit_whole_clip_target: true

# exp066 run 2 measured 5907 s for 30 rows (197 s/row, helios) without the whole-clip variant. That
# variant adds two plain generations per row: 92 -> 192 transformer forwards, so ~2.1x -> ~3 h 30 m.
slurm_time: "0-06:00:00"
