# exp150 found rank 32's step-300 checkpoint beats its own step-600 read (exp143) on ESR-1/ESR-5/
# PSR-5, mirroring exp149's rank-64 overtraining shape -- but unlike rank 64, step 300 did NOT buy
# back preserved-class motion (39.1% mean loss vs step 600's 35.9%, slightly worse not better).
# exp151 then showed rank 64's curve was still rising one point earlier (step 200 beat step 300 on
# every ESR/PSR cell) while its motion margin got measurably worse (0.176, close to the 0.15
# floor). This checks whether rank 32 shows the same shape one save-interval earlier: does ESR/PSR
# keep improving at step 200, and does its motion margin also erode the way rank 64's did?
# Eval-only against exp142's already-saved step-200 checkpoint, no new training required.
# Run: ./submit_job.py athena experiments/imagenet/exp152_eval_chainsaw_rank32_step200_2b/config.yaml
job_type: eval
mode: imagenet

model_id: THUDM/CogVideoX-2b
prompts_csv: prompts/imagenet_objects.csv
erased_class: "chain saw"

# exp142's step-200 checkpoint (one save interval before exp150's step-300) -- same LoRA (rank 32),
# same training run, only the stopping point differs. exp142's live monitor showed concept top-1
# first reaching 0.00 at step 200, so this is the earliest checkpoint expected to be converged.
lora_checkpoint_dir: experiments/imagenet/exp142_frame_replace_chainsaw_rank32_matched_lr_2b/outputs_20260822_224618/frame_replace_lora_step200

eval_inference_steps: 50
disable_mlflow: true

# exp150 (identical 200-video protocol, exp142's step-300 checkpoint) ran 9289s (2.58h) on helios.
# Same model, same eval-only forward pass, no reason to expect a different runtime here.
slurm_time: "0-14:00:00"
