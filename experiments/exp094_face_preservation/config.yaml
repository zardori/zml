# Preservation (retention-anchor) latents for the face/identity-erasure protocol.
# One dataset covers all five identities plus a 10-prompt generic-face anchor set; each erase run
# drops the identity it is erasing via `retention_exclude`. Unlike T2VUnlearning's single
# randomly-chosen anchor identity (unreproducible — the draw is unpublished), all four remaining
# identities are anchored here (a stronger, reproducible constraint — see docs/face_identity.md's
# deviations table), plus generic anchors with no analogue in the paper: the collateral risk unique
# to identity erasure is the model losing the ability to render human faces at all, which the
# four-identity anchors alone would not catch if their own renders happen to be face-light.
# Run: ./submit_job.py athena experiments/exp094_face_preservation/config.yaml
job_type: precompute
method: preservation

csv_path: prompts/face_preservation.csv   # 5 identities x 3 + 10 generic, seeds 7601-7625

model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0
save_videos: false

# 25 clips, generation only (no detection or editing). exp068 (10 classes x 3) allowed 8h for 30.
slurm_time: "0-08:00:00"
