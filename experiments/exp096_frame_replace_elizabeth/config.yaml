# frame_replace erasure of QUEEN ELIZABETH II, same regime as exp095 (Obama) but with
# `target_variant` narrowed to whichever value exp095's grid found better — LR/target_variant are not
# variables under test here, and re-running the full grid would spend 2x the compute to answer a
# question exp095 already answers. FILL IN target_variant below once exp095 has a winner.
#
# Second pilot identity confirmed by exp090's actual gate numbers (Obama + Elizabeth), superseding
# the pre-run Obama + Merkel guess this experiment originally targeted — see exp090's notes.md.
#
# FILL IN the exp093/exp094 outputs_{timestamp} once those datasets are built and reviewed.
# Run: ./submit_job.py helios experiments/exp096_frame_replace_elizabeth/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: face
concept_target: "Queen Elizabeth II"

metadata_file: experiments/exp093_split_face_elizabeth_dataset/outputs_TIMESTAMP/metadata.json
latents_dir: experiments/exp093_split_face_elizabeth_dataset/outputs_TIMESTAMP/latents
# FILL IN: "split" or "wholeclip", whichever exp095 found better. Placeholder below is not a result.
target_variant: split

retention_metadata_file: experiments/exp094_face_preservation/outputs_TIMESTAMP/metadata.json
retention_latents_dir: experiments/exp094_face_preservation/outputs_TIMESTAMP/latents
retention_exclude: "Queen Elizabeth II"
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: 2

control_concept_prompts: prompts/face_identities/queen_elizabeth_ii.csv
control_related_prompts: prompts/face_identities/others_queen_elizabeth_ii.csv
control_unrelated_prompts: prompts/face_identities/others_queen_elizabeth_ii.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001
steps: 200
save_interval: 20

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

slurm_time: "0-16:00:00"
