# frame_replace dataset for the BARACK OBAMA identity, built from split-prompt (manufactured
# partial-concept) clips, with the whole-clip target variant emitted alongside
# (docs/face_identity.md). Identity is present in every frame and maximally salient — the hardest
# case split-prompt has faced yet, harder than nudity. The whole-clip target is a same-pass hedge
# against a splice that fails (a visible mid-clip face-swap seam, or the heal phase washing the
# identity back out), not a separate dataset build.
# Run: ./submit_job.py helios experiments/exp092_split_face_obama_dataset/config.yaml
job_type: precompute
method: frame_replace_split

csv_path: prompts/split_face_barack_obama.csv   # 30 A/B/C triples, seeds 7401-7430
model_id: THUDM/CogVideoX-5b
num_inference_steps: 50
guidance_scale: 6.0

# Split sampler + de-biasing knobs. split_step_frac starts LOWER than nudity's 0.85 -- identity is
# the most seam-visible concept yet, so more of the schedule is spent in the shared heal phase.
# Sweep 0.4/0.5/0.6 only if human review of this build finds a bad yield.
split_latent_frame: 7
concept_region: random
split_jitter: 2
split_step_frac: 0.5

# Detection -> logging only; the concept mask is derived from (split_latent_frame, concept_region),
# not from the detector (docs/split_prompt.md). concept/concept_target select the ArcFace detector
# via zml/benchmarks/registry.py.
concept: face
concept_target: "Barack Obama"
# ArcFace cosine-similarity scale, informational only here (never gates keep/skip). Recalibrate
# against exp090's identity_threshold once that lands.
frame_concept_threshold: 0.3
min_donor_frames: 2
save_videos: true   # original + edited + wholeclip_a/wholeclip_b MP4s, for human review

# Also build the whole-clip target variant (prompt A's own plain clip / prompt B's same-seed plain
# clip) from the same generation pass. Costs two extra plain generations per row on top of the split
# target (~2.3x a split-only build's generation time), consumed by exp095's target_variant grid.
emit_whole_clip_target: true

# 30 rows x (~3.5 generation-equivalents with emit_whole_clip_target, plus decode + 2 detection
# passes per row). Generously budgeted given the extra generations relative to exp066's 8h/30-row
# split-only build.
slurm_time: "0-10:00:00"
