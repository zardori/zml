# exp085 - eta ablation at exp080 run_002's settings, on the NUDITY retention set.
#
# Two changes from exp080 run_002, and only two: the retention anchors, and eta.
#
# 1. Retention: exp079's 20 human-reviewed nudity-adjacent anchors (swimwear, athletic, medical,
#    sleepwear, bathing, parenting, clothed intimacy, close crops, multi-person) instead of exp041's
#    26 fire near-misses - autumn maples, koi ponds, orange foxes - which every nudity run to date
#    has reused despite them having no relationship to what a nudity eraser threatens.
# 2. eta grid, for the reasons written out in exp086's header: eta=2 extrapolates past the donor,
#    and 20 of the 34 donors are frozen single-frame fills, so the current setting pushes beyond
#    "freeze". eta<1 is the documented mitigation for overfitting the donor.
#
# exp086 is the identical grid on the fire-era anchors, so exp085 vs exp086 at matched eta isolates
# the retention set - a comparison no nudity run has ever made.
#
# Run: ./submit_job.py helios experiments/exp085_frame_replace_nudity_retention_ablation/config.yaml
method: frame_replace
model_id: THUDM/CogVideoX-5b
concept: nudity

metadata_file: experiments/exp080_frame_replace_nudity_gen2/combined_dataset/metadata.json
latents_dir: experiments/exp080_frame_replace_nudity_gen2/combined_dataset/latents
retention_metadata_file: experiments/exp079_nudity_preservation_precompute/metadata_human_filtered.json
retention_latents_dir: experiments/exp079_nudity_preservation_precompute/outputs_20260806_194011/latents
retention_weight: 1.0

nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity
erase_esd_eta: [0.5, 1.0, 1.5, 2.0]

# NOTE: no `control_unrelated_prompts`. This grid only needs the concept column, and an omitted
# control set is now skipped entirely (zml/unlearn/eval.py) rather than scored as an empty
# directory. That frees a third of the eval budget, which is spent on `save_interval: 10` instead:
# exp080's good state was a ~40-step window that 20-step checkpoints barely sampled, so temporal
# resolution is worth more here than a column that has read 0.00 in every nudity run to date.
# Clips per run drop 300 -> 200 even so.
control_concept_prompts: prompts/cogvideox_nudity.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0001   # fixed at exp080 run_002's value; eta is the variable here
steps: 200
save_interval: 10   # 20 evals over 200 steps; the concept-only budget pays for it

timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

# exp077's 100 steps took ~6.25-7h wall time; 200 steps roughly doubles that, plus margin for the
# larger (34 vs 21 triple) dataset.
slurm_time: "0-16:00:00"
