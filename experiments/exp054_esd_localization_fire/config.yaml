method: esd_preservation
model_id: THUDM/CogVideoX-5b
prompts_path: prompts/cogvideox_fire_100.csv
control_concept_prompts: prompts/cogvideox_fire_control_fire.txt
control_related_prompts: prompts/cogvideox_fire_control_related.txt
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.txt
preservation_prompts_path: prompts/cogvideox_fire_preservation.csv
preservation_weight: 1.0
lora_rank: 8
lora_alpha: 8.0
steps: 1000
save_interval: 200
lora_dropout: 0.0
eval_num_prompts: 5
eval_inference_steps: 50
negative_guidance_scale: 1.0
learning_rate: 0.0005
global_seed: 42

# --- Mask-based localization (T2VUnlearning L_loc), optional add-on to ESD + preservation ---
# Penalizes LoRA edits outside the concept region so erasure stays localized. The mask is built
# from the "fire" token's text->video attention. mask_threshold: 0.0 -> soft normalized mask
# (>0 binarizes). localization_weight is the L_loc coefficient (tune per results).
use_localization: true
localization_weight: 1.0
mask_concept_word: "fire"
mask_threshold: 0.0

# Localization disables gradient checkpointing for the student forget forward, so each step needs
# more activation memory than plain esd_preservation. Prefer helios (96 GB); on athena (40 GB) a
# shorter debug run may be needed first.
slurm_time: "0-12:00:00"
