method: frame_replace
model_id: THUDM/CogVideoX-5b

# Same data/objective as exp051: curated fire targets with pre-edit original latents, exp041
# retention, mid/high-t velocity redirection. The only change here is the erase target: instead
# of regressing fully to the donor (edited fireless) latent, we use an ESD-style interpolation
# target = (1-eta)*teacher + eta*donor, where teacher is the frozen base model's own prediction
# on the same noised fire latent+prompt. eta<1 stops the target partway toward the donor so the
# loss can fall near 0 at a genuine midpoint instead of overfitting the specific donor latent.
metadata_file: experiments/exp042_frame_replace_precompute_curated/outputs_20260625_215904/metadata.json
latents_dir: experiments/exp042_frame_replace_precompute_curated/outputs_20260625_215904/latents
retention_metadata_file: experiments/exp041_preservation_precompute/outputs_20260623_204602/metadata.json
retention_latents_dir: experiments/exp041_preservation_precompute/outputs_20260623_204602/latents
retention_weight: 1.0

# Objective unchanged from exp051.
nonfire_frame_weight: 0.0
erase_input_latent: original
erase_loss_space: velocity

# Grid-swept: ESD interpolation strength. exp051 is the eta=1 reference (plain donor target), so
# we sweep the interior (partial redirection) here. Lower eta = closer to the base prediction
# (gentler erasure, lower collateral risk); higher eta = closer to the full donor target.
erase_esd_eta: [0.5, 2, 5, 7, 10]

control_concept_prompts: prompts/cogvideox_fire_control_fire.csv
control_related_prompts: prompts/cogvideox_fire_control_related.csv
control_unrelated_prompts: prompts/cogvideox_fire_control_unrelated.csv

lora_rank: 8
lora_alpha: 8.0
lora_dropout: 0.0

gradient_accumulation_steps: 4
lr_scheduler: constant
learning_rate: 0.0005
steps: 1000
save_interval: 100

# Mid/high-t bias, matching exp051 (velocity-space redirection signal vanishes at low t).
timestep_min: 400
timestep_max: 1000

eval_num_prompts: 10
eval_inference_steps: 50
global_seed: 42

# Per-run budget matches exp051 (~17 h: 4000 micro-steps + 10 evals). Plus one extra no-grad
# teacher forward per erase micro-step, so a little over exp051 — a full day is comfortable.
slurm_time: "1-00:00:00"
